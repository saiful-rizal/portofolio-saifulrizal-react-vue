<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saiful Rizal — Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html,body{overflow:hidden;height:100%;width:100%}
        :root{--bg:#050505;--text:#fff;--dim:rgba(255,255,255,0.35);--mute:rgba(255,255,255,0.08);--accent:#6366f1;--line:rgba(255,255,255,0.06);--line-b:rgba(255,255,255,0.15)}
        body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

        @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes clipIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0% 0 0)}}
        @keyframes drawH{from{transform:scaleX(0)}to{transform:scaleX(1)}}
        @keyframes drawV{from{transform:scaleY(0)}to{transform:scaleY(1)}}
        @keyframes breathe{0%,100%{opacity:0.08}50%{opacity:0.2}}
        @keyframes dotBeat{0%,100%{transform:scale(1);opacity:0.4}50%{transform:scale(2.2);opacity:1}}
        @keyframes gridIn{from{opacity:0}to{opacity:1}}
        @keyframes scan{0%{top:-5%}100%{top:105%}}
        @keyframes digitRoll{0%{transform:translateY(-100%);opacity:0}30%{opacity:1}100%{transform:translateY(0);opacity:1}}
        @keyframes colonBlink{0%,100%{opacity:1}50%{opacity:0.12}}
        @keyframes msFlicker{0%,100%{opacity:0.6}25%{opacity:0.35}50%{opacity:0.7}75%{opacity:0.4}}
        @keyframes btnIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes tagInL{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
        @keyframes tagInR{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
        @keyframes subtleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
        @keyframes typeIn{from{opacity:0;letter-spacing:0.15em}to{opacity:1;letter-spacing:0.01em}}
        @keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}
        @keyframes navFloatIn{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
        @keyframes navItemIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes glowPulse{0%,100%{opacity:0.12}50%{opacity:0.3}}
        @keyframes ringRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes panelBgIn{from{opacity:0}to{opacity:1}}
        @keyframes panelBgOut{from{opacity:1}to{opacity:0}}
        @keyframes panelIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.92) translateY(20px)}to{opacity:1;transform:translate(-50%,-50%) scale(1) translateY(0)}}
        @keyframes panelOut{from{opacity:1;transform:translate(-50%,-50%) scale(1) translateY(0)}to{opacity:0;transform:translate(-50%,-50%) scale(0.92) translateY(20px)}}
        @keyframes cellPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
        @keyframes pillIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
        @keyframes expIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
        @keyframes numIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes socialIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes iconPulse{0%,100%{opacity:0.12}50%{opacity:0.3}}

        .scan{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
        .scan::after{content:'';position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(99,102,241,0.08),transparent);animation:scan 6s linear infinite}
        .panel-scroll::-webkit-scrollbar{width:3px}
        .panel-scroll::-webkit-scrollbar-track{background:transparent}
        .panel-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:2px}
        .panel-scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.12)}

        @media(max-width:640px){
            .name-main{font-size:7.5vw !important;letter-spacing:-0.02em !important}
            .name-hello{font-size:10px !important}
            .port-text{font-size:3.5vw !important}
            .label-sm{font-size:7px !important;letter-spacing:0.2em !important}
            .foot-sm{font-size:6px !important}
            .desc-text{font-size:10px !important;max-width:260px !important;line-height:1.7 !important}
            .btn-row{flex-direction:column !important;gap:8px !important;width:100% !important}
            .btn-row a{width:100%;justify-content:center !important}
            .btn-row a{padding:9px 14px !important;font-size:9px !important;gap:5px !important}
            .sw-digit{width:6.5vw !important;height:8.5vw !important;font-size:4vw !important}
            .sw-colon{font-size:4vw !important}
            .sw-ms{font-size:2.8vw !important}
            .tag-sym{font-size:4.5vw !important}
            .corner{width:16px !important;height:16px !important}
            .nav-item-label{display:none !important}
            .nav-item-icon svg{width:20px !important;height:20px !important}
            .nav-float{margin-left:10px !important;margin-right:10px !important;margin-bottom:10px !important;border-radius:16px !important;min-width:0 !important}
            .panel-box{width:96vw !important;max-height:90vh !important;padding:18px !important;border-radius:16px !important}
            .contrib-cell{width:5px !important;height:5px !important}
            .social-icon{width:38px !important;height:38px !important}
            .social-icon svg{width:16px !important;height:16px !important}
            .exp-role{font-size:13px !important}
            .exp-company{font-size:10px !important}
            .exp-tech{font-size:7px !important;padding:1px 6px !important}
            .year-label{font-size:7px !important}
            .month-label{display:none !important}
            .social-label{display:none !important}
        }
    </style>
  </head>
  <body>
    <div class="scan"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
